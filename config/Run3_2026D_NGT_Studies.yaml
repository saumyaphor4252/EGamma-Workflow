cmssw-dir: /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src
eos-dir: /eos/cms/store/group/phys_egamma/ssaumya/NGT_Studies_2026/

project:
    Reference:
      GT: 160X_dataRun3_HLT_v1

      process:
        - cmsDriver.py --conditions 160X_dataRun3_HLT_v1 --data --datatier RECO --era Run3_2026 --eventcontent RECO --scenario pp --fileout file:hltOutput_RECO_Reference.root --process MYHLT --python_filename hlt_ReRun_Config_Reference.py --step HLT:2026D -n -1
        - cmsDriver.py stepMINI -s PAT --conditions 160X_dataRun3_Prompt_v1 --datatier MINIAOD --eventcontent MINIAOD --geometry DB:Extended --era Run3_2026 --hltProcess MYHLT  --filein file:hltOutput_RECO_Reference.root --fileout file:stepMINI_Reference.root --python_filename makeMini_cfg_Reference.py -n -1
        - cd /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src/
        - eval `scramv1 runtime -sh`
        - cmsRun /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src/EgammaAnalysis/TnPTreeProducer/python/TnPTreeProducer_cfg.py isMC=False isAOD=False era=2026 doTrigger=True inputFiles=file:stepMINI_Reference.root outputFile=file:tnpNtuple_Reference.root
        - cd /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src/
        - eval `scramv1 runtime -sh`
        - cd $WORKDIR
      storefile:
        - tnpNtuple_Reference.root

    Target:
      GT: 160X_dataRun3_NGT_v4

      process:
        - cmsDriver.py --conditions 160X_dataRun3_NGT_v4 --data --datatier RECO --era Run3_2026 --eventcontent RECO --scenario pp --fileout file:hltOutput_RECO_Target.root --process MYHLT --python_filename hlt_ReRun_Config_Target.py --step HLT:2026D -n -1
        - cmsDriver.py stepMINI -s PAT --conditions 160X_dataRun3_Prompt_v1 --datatier MINIAOD --eventcontent MINIAOD --geometry DB:Extended --era Run3_2026 --hltProcess MYHLT  --filein file:hltOutput_RECO_Target.root --fileout file:stepMINI_Target.root --python_filename makeMini_cfg_Target.py -n -1
        - cd /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src
        - eval `scramv1 runtime -sh`
        - cmsRun /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src/EgammaAnalysis/TnPTreeProducer/python/TnPTreeProducer_cfg.py isMC=False isAOD=False era=2026 doTrigger=True inputFiles=file:stepMINI_Target.root outputFile=file:tnpNtuple_Target.root
        - cd /afs/cern.ch/work/s/ssaumya/private/Egamma/2026_NGT_Studies/CMSSW_16_0_7_patch1/src/
        - eval `scramv1 runtime -sh`
        - cd $WORKDIR
      storefile:
        - tnpNtuple_Target.root
